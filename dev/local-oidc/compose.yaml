name: travelmind-local-oidc

x-backend: &backend
  image: travelmind-local-oidc-backend
  environment: &backend-environment
    DATABASE_URL: postgresql+asyncpg://travelmind:${TM_LOCAL_POSTGRES_PASSWORD:?Run stack.ps1 init}@postgres:5432/travelmind
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travelmind
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: ${TM_LOCAL_POSTGRES_PASSWORD:?Run stack.ps1 init}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "travelmind", "-d", "travelmind"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: https://id.travelmind.localhost:18443
      KC_PROXY_HEADERS: xforwarded
      TM_LOCAL_CLIENT_SECRET: ${TM_LOCAL_CLIENT_SECRET:?Run stack.ps1 init}
      TM_LOCAL_ALICE_PASSWORD: ${TM_LOCAL_ALICE_PASSWORD:?Run stack.ps1 init}
      TM_LOCAL_BOB_PASSWORD: ${TM_LOCAL_BOB_PASSWORD:?Run stack.ps1 init}
    volumes:
      - keycloak:/opt/keycloak/data
      - ./realm.json:/opt/keycloak/data/import/travelmind-dev-realm.json:ro

  migrate:
    <<: *backend
    pull_policy: never
    build:
      context: ../..
      dockerfile: dev/local-oidc/backend.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - alembic upgrade head && python -m travelmind.runtime.worker_cli init-checkpoints

  api:
    <<: *backend
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      OIDC_ISSUER: https://id.travelmind.localhost:18443/realms/travelmind-dev
      OIDC_PUBLIC_ORIGIN: https://travelmind.localhost:18443
      OIDC_CLIENT_ID: travelmind-local
      OIDC_CLIENT_SECRET: ${TM_LOCAL_CLIENT_SECRET:?Run stack.ps1 init}
      OIDC_TOKEN_AUTH_METHOD: client_secret_basic
      NO_PROXY: id.travelmind.localhost,postgres,redis
    volumes:
      - ../../.artifacts/local-oidc/pki/rootCA.pem:/local-pki/rootCA.pem:ro
    command:
      - sh
      - -ec
      - |
        cat "$$(python -m certifi)" /local-pki/rootCA.pem >/tmp/travelmind-ca.pem
        export SSL_CERT_FILE=/tmp/travelmind-ca.pem
        exec uvicorn travelmind.main:app --host 0.0.0.0 --port 8000

  worker:
    <<: *backend
    pull_policy: never
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ../../backend/.env
        required: false
    command: ["python", "-m", "travelmind.runtime.worker_cli", "run"]

  frontend:
    build:
      context: ../..
      dockerfile: dev/local-oidc/frontend.Dockerfile
    environment:
      API_ORIGIN: http://api:8000

  caddy:
    image: caddy:2.11.9-alpine
    depends_on:
      - api
      - frontend
      - keycloak
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../.artifacts/local-oidc/pki:/local-pki:ro
    networks:
      default:
        aliases:
          - id.travelmind.localhost

volumes:
  postgres:
  keycloak:
