[project]
name = "travelmind-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "langchain-deepseek>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "redis>=6,<8",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: integration test that requires a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["travelmind"]
